name: pages

# Publishes the demo. Builds first, so the demo keeps working once the
# library compiles to dist/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --if-present
      - run: npm run docs:build --if-present
      - name: Collect site
        run: |
          mkdir -p _site
          # The docs site (if built) is the root; the demo, examples and build sit beside it.
          if [ -d site ]; then cp -R site/. _site/; fi
          cp demo.html _site/
          if [ ! -f _site/index.html ]; then cp README.md _site/; fi
          if [ -d dist ]; then cp -R dist _site/; fi
          if [ -d examples ]; then cp -R examples _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
