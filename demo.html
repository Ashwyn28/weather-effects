<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather effects demo</title>
<style>
  :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
  body { margin: 0; padding: 48px 16px; max-width: 640px; margin-inline: auto; background: #f4f5f2; color: #222; }
  body.night { background: #232426; color: #eee; }
  canvas.weather { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; padding: 6px 10px; }
  .card { margin-top: 48px; padding: 24px; border-top: 2px solid currentColor; }
</style>
<h1>Weather effects</h1>
<div class="controls" id="conditions"></div>
<p class="controls"><button id="night">Night</button><button id="pause">Pause</button></p>
<div class="card"><h2>A ledge for the rain</h2><p>Headings and the rule above are collision surfaces.</p></div>
<div class="card"><h2>Another one</h2><p>Snow settles here.</p></div>
<canvas class="weather" aria-hidden="true"></canvas>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { createWeatherEffects, CONDITIONS } from './src/index.js';
const effects = createWeatherEffects({ canvas: document.querySelector('canvas.weather'), THREE });
let night = false, condition = 'rain';
effects.resize(innerWidth, innerHeight);
effects.setSurfaces(() => [...document.querySelectorAll('h2, .card')].map(el => {
  const r = el.getBoundingClientRect();
  return { points: [{ x: r.left, y: r.top }, { x: r.right, y: r.top }] };
}));
// Paint the cards so droplets have something to refract.
effects.setBackground((ctx, { night }) => {
  for (const card of document.querySelectorAll('.card')) {
    const r = card.getBoundingClientRect();
    ctx.fillStyle = night ? '#3a4a55' : '#c9dde6'; ctx.fillRect(r.left, r.top, r.width, r.height);
  }
  return { color: night ? '#232426' : '#f4f5f2' };
});
const apply = () => { document.body.classList.toggle('night', night); effects.setWeather(condition, { night }); };
for (const id of CONDITIONS) {
  const button = Object.assign(document.createElement('button'), { textContent: id });
  button.onclick = () => { condition = id; apply(); };
  document.getElementById('conditions').append(button);
}
document.getElementById('night').onclick = () => { night = !night; apply(); };
document.getElementById('pause').onclick = e => { effects.playing ? effects.pause() : effects.play(); e.target.textContent = effects.playing ? 'Pause' : 'Play'; };
addEventListener('resize', () => effects.resize(innerWidth, innerHeight));
addEventListener('scroll', () => effects.invalidate({ clearDeposits: true }), { passive: true });
addEventListener('pointermove', e => effects.setPointer(e.clientX, e.clientY));
apply();
window.effects = effects;
</script>
